    interval: 86400
  ir-direct:
    type: http
    behavior: domain
    format: text
    url: https://raw.githubusercontent.com/Chocolate4U/Iran-clash-rules/release/direct.txt
    path: ./rule-providers/direct.txt
    interval: 86400
  ir-cidr:
    type: http
    behavior: ipcidr
