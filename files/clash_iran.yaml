  ir-domains:
    type: http
    behavior: domain
    format: text
    url: https://raw.githubusercontent.com/Chocolate4U/Iran-clash-rules/release/domains.txt
    path: ./rule-providers/domains.txt
    interval: 86400
  ir-direct:
    type: http
    behavior: domain
    format: text
    url: https://raw.githubusercontent.com/Chocolate4U/Iran-clash-rules/release/direct.txt
    path: ./rule-providers/direct.txt
    interval: 86400
  ir-cidr:
    type: http
    behavior: ipcidr
    format: text
    url: https://raw.githubusercontent.com/Chocolate4U/Iran-clash-rules/release/ir.txt
    path: ./rule-providers/ir.txt
    interval: 86400
  ads:
    type: http
    behavior: domain
    format: text
    url: https://raw.githubusercontent.com/Chocolate4U/Iran-clash-rules/release/ads.txt
    path: ./rule-providers/ads.txt
    interval: 86400
