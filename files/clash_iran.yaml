rule-providers:
  ir-domains:
    type: http
    behavior: domain
    format: text
    url: https://raw.githubusercontent.com/Chocolate4U/Iran-clash-rules/release/domains.txt
    path: ./rule-providers/domains.txt
    interval: 86400
  ir-direct:
    type: http
    behavior: domain
    format: text
    url: https://raw.githubusercontent.com/Chocolate4U/Iran-clash-rules/release/direct.txt
    path: ./rule-providers/direct.txt
    interval: 86400
  ir-cidr:
    type: http
    behavior: ipcidr
    format: text
    url: https://raw.githubusercontent.com/Chocolate4U/Iran-clash-rules/release/ir.txt
    path: ./rule-providers/ir.txt
    interval: 86400
  ads:
    type: http
    behavior: domain
    format: text
    url: https://raw.githubusercontent.com/Chocolate4U/Iran-clash-rules/release/ads.txt
    path: ./rule-providers/ads.txt
    interval: 86400
rules:
- RULE-SET,ads,REJECT
- RULE-SET,ir-domains,🇮🇷 IRAN
- RULE-SET,ir-direct,🇮🇷 IRAN
- RULE-SET,ir-cidr,🇮🇷 IRAN,no-resolve
- GEOIP,IR,🇮🇷 IRAN,no-resolve
- IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
- IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
- IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
- IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
- IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
- IP-CIDR,198.18.0.0/16,DIRECT,no-resolve
- MATCH,🌐 FINAL
