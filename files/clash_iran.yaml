- RULE-SET,ads,REJECT
- RULE-SET,ir-domains,🇮🇷 IRAN
- RULE-SET,ir-direct,🇮🇷 IRAN
- RULE-SET,ir-cidr,🇮🇷 IRAN,no-resolve
- GEOIP,IR,🇮🇷 IRAN,no-resolve
